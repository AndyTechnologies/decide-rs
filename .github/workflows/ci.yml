name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all --locked

      - name: Build release
        run: cargo build --release --locked

  typescript:
    name: TypeScript extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extensions/pi-decide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/pi-decide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  release:
    name: Create release artifacts
    needs: [rust, typescript]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/decide-rs dist/decide-rs-x86_64-unknown-linux-gnu
          cp target/release/decide-rs-mcp dist/decide-rs-mcp-x86_64-unknown-linux-gnu
          cp target/release/decide-rs-download dist/decide-rs-download-x86_64-unknown-linux-gnu
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decide-rs-release
          path: dist/
          retention-days: 90