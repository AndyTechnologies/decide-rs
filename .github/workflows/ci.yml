name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all --locked

      - name: Build release
        run: cargo build --release --locked

  typescript:
    name: TypeScript extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extensions/pi-decide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/pi-decide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  release:
    name: Create release artifacts
    needs: [rust, typescript]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release --locked

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/release/decide-rs dist/decide-rs-x86_64-unknown-linux-gnu
          cp target/release/decide-rs-mcp dist/decide-rs-mcp-x86_64-unknown-linux-gnu
          cp target/release/decide-rs-download dist/decide-rs-download-x86_64-unknown-linux-gnu
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decide-rs-release
          path: dist/
          retention-days: 90

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} - MVP Complete
          body: |
            ## decide-rs v0.1.1 - MVP Complete

            ### Binaries (Linux x86_64):
            - `decide-rs` - CLI for structured decisions (choice/noul/score)
            - `decide-rs-mcp` - MCP server (stdio + TCP transport)
            - `decide-rs-download` - Checkpoint downloader

            ### Features:
            - Local Julia-1 inference via `julia1` crate (no external deps)
            - MCP Server with stdio/TCP, structuredContent, per-path errors
            - CLI with subcommands: choice|noul|score|run|demo|fetch
            - JSON/JSONL input, --model, --lenient, --pretty
            - Pi extension: pi-decide (installs via pi install)
            - Auto-setup on install: downloads binaries and model automatically

            ### Installation

            ```bash
            # From release artifacts
            curl -L https://github.com/AndyTechnologies/decide-rs/releases/download/v0.1.1/decide-rs-x86_64-unknown-linux-gnu -o ~/.local/bin/decide-rs
            curl -L https://github.com/AndyTechnologies/decide-rs/releases/download/v0.1.1/decide-rs-mcp-x86_64-unknown-linux-gnu -o ~/.local/bin/decide-rs-mcp
            chmod +x ~/.local/bin/decide-rs*
            decide-rs fetch

            # Pi extension
            pi install github:AndyTechnologies/decide-rs#pi-decide
            ```

            ### Verification

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ### Checkpoint

            Model downloads to `~/.local/share/decide-rs/julia-checkpoint/` (rev `a85b127321d580d65176c89ced8273f305745d85`, SHA256 verified).

            ### License

            MIT
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}