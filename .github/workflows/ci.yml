name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all --locked

      - name: Build release
        run: cargo build --release --locked

  typescript:
    name: TypeScript extension build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./extensions/pi-decide
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extensions/pi-decide/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  build-multiplatform:
    name: Build release binaries (${{ matrix.os }})
    needs: [rust, typescript]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin-suffix: x86_64-unknown-linux-gnu
            platform-key: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin-suffix: x86_64-pc-windows-msvc
            platform-key: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi
          cp target/${{ matrix.target }}/release/decide-rs${EXT} dist/decide-rs-${{ matrix.bin-suffix }}${EXT}
          cp target/${{ matrix.target }}/release/decide-rs-mcp${EXT} dist/decide-rs-mcp-${{ matrix.bin-suffix }}${EXT}
          cp target/${{ matrix.target }}/release/decide-rs-download${EXT} dist/decide-rs-download-${{ matrix.bin-suffix }}${EXT}
          # Generate checksums
          sha256sum dist/* > dist/SHA256SUMS-${{ matrix.platform-key }}.txt
          cat dist/SHA256SUMS-${{ matrix.platform-key }}.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: decide-rs-${{ matrix.platform-key }}
          path: dist/
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [build-multiplatform]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: decide-rs-*
          path: dist/
          merge-multiple: true

      - name: Consolidate checksums
        shell: bash
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS 2>/dev/null || true
          echo '=== Consolidated SHA256SUMS ==='
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## decide-rs ${{ github.ref_name }}

            ### Binaries
            | Platform | decide-rs | decide-rs-mcp | decide-rs-download |
            |----------|-----------|---------------|-------------------|
            | Linux x86_64 | [download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decide-rs-x86_64-unknown-linux-gnu) | [download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decide-rs-mcp-x86_64-unknown-linux-gnu) | [download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decide-rs-download-x86_64-unknown-linux-gnu) |
            | Windows x86_64 | [download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decide-rs-x86_64-pc-windows-msvc.exe) | [download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decide-rs-mcp-x86_64-pc-windows-msvc.exe) | [download](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decide-rs-download-x86_64-pc-windows-msvc.exe) |

            ### Features
            - Local Julia-1 inference via `julia1` crate (no external deps)
            - MCP Server with stdio transport, structuredContent, per-path errors
            - CLI with subcommands: choice|noul|score|run|demo|fetch
            - JSON/JSONL input, --model, --lenient, --pretty
            - Pi extension: pi-decide (installs via `pi install`)
            - Auto-setup on install: downloads binaries and model automatically

            ### Installation

            **From release artifacts (Linux x86_64 example):**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decide-rs-x86_64-unknown-linux-gnu -o ~/.local/bin/decide-rs
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/decide-rs-mcp-x86_64-unknown-linux-gnu -o ~/.local/bin/decide-rs-mcp
            chmod +x ~/.local/bin/decide-rs*
            decide-rs fetch
            ```

            **Pi extension:**
            ```bash
            pi install github:AndyTechnologies/decide-rs#pi-decide
            ```

            ### Verification

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ### Checkpoint

            Model downloads to `~/.local/share/decide-rs/julia-checkpoint/` (rev `a85b127321d580d65176c89ced8273f305745d85`, SHA256 verified).

            ### License

            MIT
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}