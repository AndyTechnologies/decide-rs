[package]
name = "decide-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.76"
futures = "=0.3.30"
julia1 = "=0.1.2"
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = "=1.0.152"
sha2 = "=0.10.9"
thiserror = "=2.0.1"
tokio = { version = "=1.54.0", features = ["full"] }
ureq = "=2.12.1"
rmcp = { version = "=3.5.1", features = ["macros", "transport-io", "server"] }

[[bin]]
name = "decide-rs-mcp"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "decide-rs-download"
path = "src/bin/download_checkpoint.rs"